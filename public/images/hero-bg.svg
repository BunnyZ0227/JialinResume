<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dedad4"/>
      <stop offset="100%" stop-color="#e8e4da"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1c" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#1c1c1c" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1c" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1c1c1c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#g1)"/>
  <line x1="0" y1="40" x2="1600" y2="40" stroke="#1c1c1c" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="80" x2="1600" y2="80" stroke="#1c1c1c" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="120" x2="1600" y2="120" stroke="#1c1c1c" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="200" x2="1600" y2="200" stroke="#1c1c1c" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="960" x2="1600" y2="960" stroke="#1c1c1c" stroke-opacity="0.05" stroke-width="1"/>
  <!-- Abstract geometric shapes -->
  <rect x="80" y="120" width="240" height="320" fill="#1c1c1c" fill-opacity="0.015" rx="0"/>
  <rect x="180" y="220" width="140" height="180" fill="#1c1c1c" fill-opacity="0.02" rx="0"/>
  <circle cx="1200" cy="350" r="180" fill="url(#g1)"/>
  <circle cx="1280" cy="320" r="100" fill="url(#g2)"/>
  <line x1="1400" y1="100" x2="1550" y2="500" stroke="#1c1c1c" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="1450" y1="100" x2="1580" y2="400" stroke="#1c1c1c" stroke-opacity="0.03" stroke-width="1"/>
  <rect x="1320" y="600" width="200" height="300" fill="#1c1c1c" fill-opacity="0.015" rx="0"/>
  <circle cx="100" cy="800" r="60" fill="#1c1c1c" fill-opacity="0.01"/>
  <circle cx="100" cy="800" r="40" fill="#1c1c1c" fill-opacity="0.015"/>
  <!-- Horizontal lines for grid feel -->
  <g stroke="#1c1c1c" stroke-opacity="0.02" stroke-width="0.5">
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
  </g>
  <!-- Large abstract circle -->
  <circle cx="400" cy="600" r="300" fill="#1c1c1c" fill-opacity="0.008"/>
</svg>
